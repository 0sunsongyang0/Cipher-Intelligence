[scanner]
ignore_globs = [
  ".git/**",
  "**/.git/**",
  ".venv/**",
  "**/.venv/**",
  "__pycache__/**",
  "**/__pycache__/**",
  "*.pyc",
  "**/*.pyc",
  "frontend/node_modules/**",
]
max_bytes = 1048576
placeholder_prefixes = [
  "replace-with-",
  "your-",
  "change-me",
  "unset",
  "example",
  "test-",
  "demo-",
  "dummy-",
  "placeholder-",
  "none",
  "null",
]
secret_name_markers = [
  "SECRET",
  "TOKEN",
  "KEY",
  "PASSWORD",
  "PASSCODE",
  "CLIENT_SECRET",
]

[[rules]]
name = "private-key-block"
pattern = "-----BEGIN (?:RSA|OPENSSH|EC|PGP) PRIVATE KEY-----"

[[rules]]
name = "credential-url"
pattern = "https?://[^\\s:@]+:[^\\s@]+@[^\\s/]+"

[[rules]]
name = "json-secret-value"
pattern = "(?i)\"[^\"]*(?:secret|token|key|password|passcode|client_secret)[^\"]*\"\\s*:\\s*\"(?!replace-with-|your-|change-me|unset|example|test-|demo-|dummy-|placeholder-|none|null|)[^\"]{12,}\""
